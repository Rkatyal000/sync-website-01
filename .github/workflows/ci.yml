name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Frontend · install + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Production build
        env:
          REACT_APP_BACKEND_URL: https://example.invalid
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/build
          retention-days: 7

  backend-bun-typecheck:
    name: Bun backend · install + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-bun
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile || bun install

      - name: TypeScript check
        run: bunx tsc --noEmit

  backend-fastapi-sanity:
    name: FastAPI backend · import sanity
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Import the app (smoke check)
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: ci_smoke
        run: python -c "import server; assert server.app is not None"
